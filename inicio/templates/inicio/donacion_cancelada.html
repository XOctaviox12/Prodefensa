{% extends "inicio/home.html" %}
{% block contenido %}

<style>
:root {
    --azul-cipol: #003366;
    --rosa-cipol: #d6336c;
    --rojo-cancel: #dc3545;
    --gris-claro: #f8f9fa;
    --gris-medio: #e9ecef;
    --texto-oscuro: #2d3748;
    --texto-medio: #4a5568;
    --sombra: rgba(0, 0, 0, 0.1);
}

/* ===== CONTENEDOR PRINCIPAL MEJORADO ===== */
.cancel-section {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 100vh;
    padding: clamp(40px, 8vw, 80px) clamp(20px, 4vw, 40px);
    background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
    animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

@keyframes fadeIn {
    from { 
        opacity: 0; 
        transform: translateY(30px); 
    }
    to { 
        opacity: 1; 
        transform: translateY(0); 
    }
}

/* ===== TARJETA MEJORADA ===== */
.cancel-card {
    background: linear-gradient(135deg, #ffffff 0%, var(--gris-claro) 100%);
    border-radius: 24px;
    padding: clamp(40px, 6vw, 60px) clamp(25px, 4vw, 40px);
    box-shadow: 0 20px 60px rgba(220, 53, 69, 0.15);
    max-width: min(500px, 90%);
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.3);
    position: relative;
    z-index: 2;
    animation: cardSlideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
}

@keyframes cardSlideIn {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ===== ICONO MEJORADO ===== */
.cancel-icon {
    font-size: clamp(4rem, 10vw, 6rem);
    color: var(--rojo-cancel);
    margin-bottom: clamp(20px, 4vw, 30px);
    animation: shake 1s cubic-bezier(0.4, 0, 0.2, 1) 0.5s both;
    display: inline-block;
    filter: drop-shadow(0 4px 12px rgba(220, 53, 69, 0.3));
}

@keyframes shake {
    0%, 100% { 
        transform: translateX(0) rotate(0deg); 
    }
    25% { 
        transform: translateX(-8px) rotate(-5deg); 
    }
    50% { 
        transform: translateX(8px) rotate(5deg); 
    }
    75% { 
        transform: translateX(-4px) rotate(-2deg); 
    }
}

/* ===== TÍTULO MEJORADO ===== */
.cancel-card h2 {
    color: var(--rojo-cancel);
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 800;
    margin-bottom: clamp(12px, 2.5vw, 20px);
    line-height: 1.2;
    background: linear-gradient(135deg, var(--rojo-cancel), #e53e3e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* ===== TEXTO MEJORADO ===== */
.cancel-card p {
    color: var(--texto-medio);
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    margin-bottom: clamp(25px, 5vw, 35px);
    line-height: 1.6;
    max-width: 90%;
    margin-left: auto;
    margin-right: auto;
}

/* ===== BOTÓN MEJORADO ===== */
.btn-return {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--azul-cipol), #0055a5);
    color: white;
    padding: clamp(12px, 2.5vw, 16px) clamp(28px, 4vw, 40px);
    border-radius: 50px;
    font-weight: 600;
    font-size: clamp(1rem, 2vw, 1.1rem);
    text-decoration: none;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 25px rgba(0, 51, 102, 0.3);
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.btn-return::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s;
}

.btn-return:hover {
    background: linear-gradient(135deg, #0055a5, var(--azul-cipol));
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 15px 35px rgba(0, 51, 102, 0.4);
    color: white;
}

.btn-return:hover::before {
    left: 100%;
}

.btn-return:active {
    transform: translateY(-1px) scale(1.02);
}

.btn-return i {
    font-size: 1.1em;
    transition: transform 0.3s ease;
}

.btn-return:hover i {
    transform: translateX(-3px);
}

/* ===== EFECTOS DECORATIVOS ===== */
.cancel-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--rojo-cancel), #e53e3e, var(--rojo-cancel));
    background-size: 200% 100%;
    animation: gradientMove 3s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Partículas de error */
.error-particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: var(--rojo-cancel);
    border-radius: 50%;
    opacity: 0;
    animation: particleFall 4s linear infinite;
}

@keyframes particleFall {
    0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
    }
}

/* ===== RESPONSIVIDAD MEJORADA ===== */
@media (max-width: 768px) {
    .cancel-section {
        padding: 30px 20px;
    }

    .cancel-card {
        padding: 35px 25px;
        border-radius: 20px;
    }

    .cancel-icon {
        margin-bottom: 25px;
    }

    .cancel-card h2 {
        margin-bottom: 15px;
    }

    .cancel-card p {
        margin-bottom: 30px;
    }

    .btn-return {
        width: min(100%, 280px);
        justify-content: center;
    }
}

@media (max-width: 480px) {
    .cancel-section {
        padding: 25px 15px;
    }

    .cancel-card {
        padding: 30px 20px;
        border-radius: 16px;
    }

    .cancel-icon {
        font-size: 3.5rem;
    }

    .cancel-card h2 {
        font-size: 1.5rem;
    }

    .cancel-card p {
        font-size: 1rem;
    }

    .btn-return {
        padding: 14px 25px;
        font-size: 1rem;
    }
}

@media (max-width: 360px) {
    .cancel-section {
        padding: 20px 12px;
    }

    .cancel-card {
        padding: 25px 18px;
    }

    .cancel-icon {
        font-size: 3rem;
    }

    .cancel-card h2 {
        font-size: 1.3rem;
    }

    .cancel-card p {
        font-size: 0.95rem;
    }
}

/* ===== MEJORAS DE ACCESIBILIDAD ===== */
.btn-return:focus {
    outline: 3px solid var(--rosa-cipol);
    outline-offset: 2px;
}

/* ===== PREVENIR SCROLL HORIZONTAL ===== */
body {
    overflow-x: hidden;
}

/* ===== MEJORAS DE RENDIMIENTO ===== */
.cancel-card {
    will-change: transform, opacity;
}

.btn-return {
    will-change: transform;
}
</style>

<section class="cancel-section">
    <!-- Efectos decorativos -->
    <div class="error-particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="error-particle" style="left: 20%; animation-delay: 0.5s;"></div>
    <div class="error-particle" style="left: 30%; animation-delay: 1s;"></div>
    <div class="error-particle" style="left: 40%; animation-delay: 1.5s;"></div>
    <div class="error-particle" style="left: 50%; animation-delay: 2s;"></div>
    <div class="error-particle" style="left: 60%; animation-delay: 2.5s;"></div>
    <div class="error-particle" style="left: 70%; animation-delay: 3s;"></div>
    <div class="error-particle" style="left: 80%; animation-delay: 3.5s;"></div>
    <div class="error-particle" style="left: 90%; animation-delay: 4s;"></div>

    <div class="cancel-card">
        <div class="cancel-icon">
            <i class="fas fa-times-circle"></i>
        </div>
        <h2>Donación Cancelada</h2>
        <p>
            Parece que cancelaste el proceso de pago.<br>
            Si fue un error, puedes intentarlo de nuevo en cualquier momento.
        </p>
        <a href="{% url 'inicio' %}" class="btn-return">
            <i class="fas fa-home"></i> Volver al Inicio
        </a>
    </div>
</section>

<!-- FontAwesome para íconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
// Efectos de partículas adicionales
document.addEventListener('DOMContentLoaded', function() {
    const section = document.querySelector('.cancel-section');
    
    // Añadir más partículas de error
    for (let i = 0; i < 15; i++) {
        const particle = document.createElement('div');
        particle.className = 'error-particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 5 + 's';
        particle.style.width = Math.random() * 6 + 4 + 'px';
        particle.style.height = Math.random() * 6 + 4 + 'px';
        particle.style.background = `rgba(220, 53, 69, ${Math.random() * 0.5 + 0.3})`;
        section.appendChild(particle);
    }
});
</script>

{% endblock %}
